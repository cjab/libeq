[package]
name = "wld-cli"
version = "0.5.1"
publish = false
edition = "2024"
authors = ["Chad Jablonski <chad@jablonski.xyz>"]
description = "An Everquest wld cli tool"
repository = "https://github.com/cjab/libeq"
keywords = ["everquest", "eq", "wld", "pfs", "s3d"]
categories = ["game-development", "compression", "parsing", "filesystem"]
license = "MIT"

[[bin]]
name = "wld-cli"
path = "src/main.rs"
test = false

[dependencies]
libeq_wld = { workspace = true, features = ["serde"] }
clap.workspace = true
ratatui = "0.30.0"
crossterm = "0.29.0"
hexyl = "0.16.0"
ansi-to-tui = "8.0.0"
serde_json = "1.0"
ron = "0.12"
